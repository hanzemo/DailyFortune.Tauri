name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev \
            squashfs-tools \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Pin linuxdeploy version
        run: |
          TAURI_TOOLKIT_PATH="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLKIT_PATH"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            -O "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          echo "linuxdeploy pinned at: $TAURI_TOOLKIT_PATH"

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DailyFortune ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --bundles appimage

      - name: Strip bundled wayland/EGL libs from AppImage
        run: |
          set -e
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage | head -1)
          echo "Processing: $APPIMAGE"

          # 解压 AppImage（不用 FUSE，直接用 unsquashfs）
          OFFSET=$(grep -abo $'\x68\x73\x71\x73' "$APPIMAGE" | head -1 | cut -d: -f1)
          echo "squashfs offset: $OFFSET"
          tail -c +$((OFFSET+1)) "$APPIMAGE" > /tmp/app.squashfs
          rm -rf /tmp/appimage-root
          unsquashfs -q -d /tmp/appimage-root /tmp/app.squashfs

          # 移除与宿主 Mesa/Wayland 冲突的捆绑库
          cd /tmp/appimage-root
          mkdir -p disabled-libs
          for pattern in \
            'usr/lib/libwayland-client.so*' \
            'usr/lib/libwayland-cursor.so*' \
            'usr/lib/libwayland-egl.so*' \
            'usr/lib/libwayland-server.so*' \
            'usr/lib/libEGL.so*' \
            'usr/lib/libGL.so*' \
            'usr/lib/libGLdispatch.so*' \
            'usr/lib/libGLX.so*' \
            'usr/lib/libgbm.so*' \
            'usr/lib/libdrm.so*'; do
            for f in $pattern; do
              [ -e "$f" ] && mv "$f" disabled-libs/ && echo "  moved: $f"
            done
          done

          # 重新打包
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp
          /tmp/appimagetool --appimage-extract-and-run /tmp/appimage-root "/tmp/DailyFortune-fixed.AppImage"

          # 覆盖原产物
          cp /tmp/DailyFortune-fixed.AppImage "DailyFortune-fixed.AppImage"

          # 把修复后的 AppImage 移回 bundle 目录
          cd "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage"
          mv "/tmp/DailyFortune-fixed.AppImage" ./
          ls -la *.AppImage

      - name: Upload fixed AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/DailyFortune-fixed.AppImage
          if-no-files-found: error
