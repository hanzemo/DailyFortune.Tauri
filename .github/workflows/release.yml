name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsecret-1-dev \
            squashfs-tools \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Pin linuxdeploy version
        run: |
          TAURI_TOOLKIT_PATH="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLKIT_PATH"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            -O "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          echo "linuxdeploy pinned at: $TAURI_TOOLKIT_PATH"

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DailyFortune ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --bundles appimage

      - name: Strip bundled wayland/EGL libs from AppImage
        run: |
          set -e
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage | head -1)
          echo "Processing: $APPIMAGE"
          file "$APPIMAGE"
          ls -la "$APPIMAGE"

          # 方式 1：直接对 AppImage 跑 unsquashfs（新版会自动找偏移）
          rm -rf /tmp/appimage-root
          if unsquashfs -q -d /tmp/appimage-root "$APPIMAGE" 2>&1; then
            echo "unsquashfs direct OK"
          else
            echo "Direct unsquashfs failed, trying manual offset scan..."

            # 方式 2：暴力扫描所有 hsqs 出现位置，用 bytes_used 字段校验
            OFFSET=""
            for off in $(grep -abo $'\x68\x73\x71\x73' "$APPIMAGE" | cut -d: -f1); do
              # squashfs superblock 结构：magic(4) + inodes(4) + mkfs_time(4) + block_size(4)
              # + fragments(4) + compression(2) + block_log(2) + flags(2) + no_ids(2)
              # + s_major(2) + s_minor(2) + root_inode(8) + bytes_used(8)
              # bytes_used 在 superblock 偏移 +40 处，8 字节小端
              BYTES_USED=$(dd if="$APPIMAGE" bs=1 skip=$((off+40)) count=8 2>/dev/null | od -An -tu8 | tr -d ' ')
              FILE_SIZE=$(stat -c %s "$APPIMAGE")
              echo "candidate offset=$off bytes_used=$BYTES_USED file_size=$FILE_SIZE"
              if [ -n "$BYTES_USED" ] && [ "$BYTES_USED" -gt 1000000 ] && [ "$BYTES_USED" -le "$FILE_SIZE" ]; then
                OFFSET="$off"
                echo "  -> valid squashfs offset: $OFFSET (bytes_used=$BYTES_USED)"
                break
              fi
            done

            if [ -z "$OFFSET" ]; then
              echo "FATAL: no valid squashfs offset found"
              exit 1
            fi

            tail -c +$((OFFSET+1)) "$APPIMAGE" > /tmp/app.squashfs
            unsquashfs -q -d /tmp/appimage-root /tmp/app.squashfs
          fi

          # 移除与宿主 Mesa/Wayland 冲突的捆绑库
          cd /tmp/appimage-root
          mkdir -p disabled-libs
          moved=0
          for pattern in \
            'usr/lib/libwayland-client.so*' \
            'usr/lib/libwayland-cursor.so*' \
            'usr/lib/libwayland-egl.so*' \
            'usr/lib/libwayland-server.so*' \
            'usr/lib/libEGL.so*' \
            'usr/lib/libGL.so*' \
            'usr/lib/libGLdispatch.so*' \
            'usr/lib/libGLX.so*' \
            'usr/lib/libgbm.so*' \
            'usr/lib/libdrm.so*'; do
            for f in $pattern; do
              if [ -e "$f" ]; then
                mv "$f" disabled-libs/
                echo "  moved: $f"
                moved=$((moved+1))
              fi
            done
          done
          echo "Total moved: $moved"

          # 重新打包
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run /tmp/appimage-root /tmp/DailyFortune-fixed.AppImage

          # 移回 bundle 目录
          cd "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage"
          mv /tmp/DailyFortune-fixed.AppImage ./
          chmod +x DailyFortune-fixed.AppImage
          ls -la *.AppImage

      - name: Upload fixed AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-AppImage
          path: src-tauri/target/release/bundle/appimage/DailyFortune-fixed.AppImage
          if-no-files-found: error
